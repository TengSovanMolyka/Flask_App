{% extends "admin/master.html" %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h2 class="fw-bold text-uppercase mb-1">Add Category</h2>
        <p class="text-muted mb-0">Create a new product category.</p>
    </div>
    <a href="{{ url_for('admin_categories.categories') }}" class="btn btn-secondary">
        <i class="bi bi-arrow-left me-1"></i>
        Back to Categories
    </a>
</div>

<div class="card shadow-sm border-0">
    <div class="card-header">
        <span class="fw-semibold">Category Information</span>
    </div>

    <div class="card-body">
        <form action="{{ url_for('admin_categories.add_category') }}"
              method="POST"
              enctype="multipart/form-data">

            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <!-- CATEGORY NAME -->
            <div class="mb-3">
                <label for="name" class="form-label fw-semibold">
                    Category Name <span class="text-danger">*</span>
                </label>
                <input type="text" id="name" name="name" class="form-control"
                       placeholder="Enter category name" required>
            </div>

            <!-- DESCRIPTION -->
            <div class="mb-3">
                <label for="description" class="form-label fw-semibold">Description</label>
                <textarea id="description" name="description" class="form-control"
                          rows="5" placeholder="Enter category description"></textarea>
            </div>

            <!-- IMAGE -->
            <div class="mb-4">
                <label for="image" class="form-label fw-semibold">Category Image</label>
                <input type="file" id="image" name="image" class="form-control"
                       accept=".jpg,.jpeg,.png,.gif,.webp">
                <div class="form-text">Allowed formats: JPG, JPEG, PNG, GIF, WEBP.</div>
            </div>

            <!-- ACTIONS -->
            <div class="d-flex justify-content-end gap-2">
                <a href="{{ url_for('admin_categories.categories') }}"
                   class="btn btn-secondary d-flex align-items-center">
                    <i class="bi bi-arrow-left-circle me-1"></i>
                    Cancel
                </a>

                <button type="submit" class="btn btn-success">
                    <i class="bi bi-check-circle me-1"></i>
                    Save Category
                </button>
            </div>
        </form>
    </div>
</div>

{% endblock %}
