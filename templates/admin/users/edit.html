{% extends "admin/master.html" %}

{% block content %}

    <h2 class="fw-bold mb-4">Edit User</h2>

    <div class="card shadow-sm border-0">
        <div class="card-body">
            <form method="POST"
                  action="{{ url_for('admin_users.edit_user', user_id=user.id) }}"
                  enctype="multipart/form-data"
                  class="row g-3">

                <!-- Profile Picture -->
                <div class="col-12 text-center mb-3">
                    <img src="{{ url_for('static', filename='uploads/profile/' ~ user.profile) }}"
                         id="previewImage"
                         class="rounded-circle border"
                         style="width: 45px; height: 45px; object-fit: cover;"
                         onerror="this.src='{{ url_for('static', filename='uploads/profile/profile-avatar.png') }}'"
                    >

                    <div class="mt-3">
                        <label class="form-label fw-semibold">Change Profile Picture</label>
                        <input type="file"
                               name="profile"
                               class="form-control"
                               accept="image/*"
                               onchange="previewProfile(event)">
                    </div>
                </div>

                <!-- Username -->
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Username</label>
                    <input type="text" name="username"
                           class="form-control"
                           value="{{ user.username }}"
                           required>
                </div>

                <!-- Address -->
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Address</label>
                    <input type="address" name="address"
                           class="form-control"
                           value="{{ user.address }}">
                </div>

                <!-- Email -->
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Email</label>
                    <input type="email" name="email"
                           class="form-control"
                           value="{{ user.email }}"
                           required>
                </div>

                <!-- Contact -->
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Contact</label>
                    <input type="contact" name="contact"
                           class="form-control"
                           value="{{ user.contact }}">
                </div>

                <!-- Role -->
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Role</label>
                    <select name="role" class="form-select">
                        <option value="User" {% if user.role == "User" %}selected{% endif %}>
                            User
                        </option>
                        <option value="Admin" {% if user.role == "Admin" %}selected{% endif %}>
                            Admin
                        </option>
                        <option value="Owner" {% if user.role == "Owner" %}selected{% endif %}>
                            Owner
                        </option>
                    </select>
                </div>

                <!-- Password -->
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Password
                        <small class="text-muted">(Leave blank to keep current password)</small>
                    </label>
                    <input type="password" name="password"
                           class="form-control"
                           placeholder="Leave blank if unchanged"
                           value="{{ user.password }}">
                </div>

                <!-- Status -->
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Status</label>
                    <select name="status" class="form-select">
                        <option value="Active" {% if user.status == "Active" %}selected{% endif %}>
                            Active
                        </option>
                        <option value="Inactive" {% if user.status == "Inactive" %}selected{% endif %}>
                            Inactive
                        </option>
                    </select>
                </div>

                <!-- Submit -->
                <div class="col-12 d-flex justify-content-end mt-4 gap-2">
                    <a href="{{ url_for('admin_users.users') }}" class="btn btn-secondary ms-2">
                        <i class="bi bi-arrow-left-circle me-1"></i> Cancel
                    </a>

                    <button type="submit" class="btn btn-success">
                        <i class="bi bi-floppy me-1"></i> Update User
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Preview Image -->
    <script>
        function previewProfile(event) {
            const image = document.getElementById("previewImage");
            image.src = URL.createObjectURL(event.target.files[0]);
        }
    </script>

{% endblock %}
