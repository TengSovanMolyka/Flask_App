{% extends "admin/master.html" %}

{% block content %}

    <h2 class="fw-bold mb-4">Add New User</h2>

    <div class="card shadow-sm border-0">
        <div class="card-body">
            <form method="POST"
                  action="{{ url_for('admin_users.add_user') }}"
                  enctype="multipart/form-data"
                  class="row g-3">

                <!-- Profile Picture -->
                <div class="col-12 text-center mb-3">
                    <img src="{{ url_for('static', filename='uploads/profile/profile-avatar.png') }}"
                         id="previewImage"
                         class="rounded-circle border"
                         width="120"
                         height="120"
                         style="object-fit: cover;">

                    <div class="mt-3">
                        <label class="form-label fw-semibold">Profile Picture</label>
                        <input type="file"
                               name="profile"
                               class="form-control"
                               accept="image/*"
                               onchange="previewProfile(event)">
                    </div>
                </div>

                <!-- Username -->
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Username</label>
                    <input type="text" name="username" class="form-control" placeholder="Enter name" required>
                </div>

                <!-- Address -->
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Address</label>
                    <input type="address" name="address" class="form-control" placeholder="e.g. 1234 Main St">
                </div>

                <!-- Email -->
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Email</label>
                    <input type="email" name="email" class="form-control" placeholder="Enter email" required>
                </div>

                <!-- Password -->
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                </div>

                <!-- Contact -->
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Contact</label>
                    <input type="contact" name="contact" class="form-control" placeholder="+xxxxxxxxxxx">
                </div>

                <!-- Role -->
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Role</label>
                    <select name="role" class="form-select" required>
                        <option value="User">User</option>
                        <option value="Admin">Admin</option>
                        <option value="Owner">Owner</option>
                    </select>
                </div>

                <!-- Status -->
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Status</label>
                    <select name="status" class="form-select" required>
                        <option value="Active" selected>Active</option>
                        <option value="Inactive">Inactive</option>
                    </select>
                </div>

                <!-- Submit -->
                <div class="col-12 d-flex justify-content-end mt-4 gap-2">
                    <a href="{{ url_for('admin_users.users') }}" class="btn btn-secondary ms-2">
                        <i class="bi bi-arrow-left-circle me-1"></i> Cancel
                    </a>

                    <button type="submit" class="btn btn-success">
                        <i class="bi bi-plus-circle me-1"></i> Add User
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Preview Image -->
    <script>
        function previewProfile(event) {
            const image = document.getElementById("previewImage");
            image.src = URL.createObjectURL(event.target.files[0]);
        }
    </script>

{% endblock %}
