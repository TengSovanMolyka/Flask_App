<aside class="admin-sidebar">

    <!-- Logo -->
    <div class="sidebar-header text-uppercase">
        <a href="/admin/dashboard" class="admin-logo">
            La Beauté Studio
        </a>
    </div>

    <!-- Dashboard Menu -->
    <nav class="sidebar-nav">
        <ul class="nav flex-column">

            <!-- Dashboard -->
            <li class="nav-item">
                <a href="/admin/dashboard"
                   class="nav-link {{ 'active' if module =='dashboard' else '' }}">
                    <span>
                        <i class="bi bi-grid-1x2"></i>
                        Dashboard
                    </span>
                </a>
            </li>

            {% if session.get("user_role") == "Admin" %}
            <!-- User -->
            <li class="nav-item">
                <a href="{{ url_for('admin_users.users') }}"
                   class="nav-link {{ 'active' if module =='users' else '' }}">
                    <span>
                        <i class="bi bi-people"></i>
                        Users Management
                    </span>
                </a>
            </li>
            {% endif %}

            <!-- Product Menu -->
            {% set product_modules = ['products', 'categories', 'inventory'] %}
            <li class="nav-item">
                <a href="#productMenu"
                   class="nav-link {{ 'active' if module in product_modules else '' }}"
                   data-bs-toggle="collapse"
                   aria-expanded="{{ 'true' if module in product_modules else 'false' }}"
                   aria-controls="productMenu"
                >
                    <span>
                        <i class="bi bi-box-seam"></i>
                        Products Management
                    </span>
                    <i class="bi bi-chevron-down"></i>
                </a>

                <div class="collapse {{ 'show' if module in product_modules else '' }}"
                     id="productMenu">
                    <ul class="nav flex-column">
                        <!-- Products -->
                        <li>
                            <a href="{{ url_for('admin_products.products') }}"
                               class="nav-link {{ 'active' if module == 'products' else '' }}">
                                <i class="bi bi-box"></i>
                                <span>Products</span>
                            </a>
                        </li>
                        <!-- Categories -->
                        <li>
                            <a href="{{ url_for('admin_categories.categories') }}"
                               class="nav-link {{ 'active' if module == 'categories' else '' }}">
                                <i class="bi bi-tags"></i>
                                <span>Categories</span>
                            </a>
                        </li>
                        <li>
                            <a href=""
                               class="nav-link {{ 'active' if module == 'inventory' else '' }}">
                                <i class="bi bi-boxes"></i>
                                <span>Inventory</span>
                            </a>
                        </li>
                    </ul>
                </div>
            </li>

            <li class="nav-item {{ 'active' if module =='setting' else '' }}">
                <a href="" class="nav-link">
                    <span>
                        <i class="bi bi-gear"></i>
                        Settings
                    </span>
                </a>
            </li>

            <li class="nav-item {{ 'active' if module =='store' else '' }}">
                <a href="/" class="nav-link">
                    <span>
                        <i class="bi bi-shop"></i>
                        View Store
                    </span>
                </a>
            </li>

        </ul>
    </nav>

    <!-- Logout -->
    <div class="sidebar-footer">
        <a href="{{ url_for('admin_auth.logout') }}" class="logout-link">
            <i class="bi bi-box-arrow-left"></i>
            <span>Logout</span>
        </a>
    </div>

</aside>
